# Owner-authorized public build. Runs automatically when this repository becomes public.
name: Build IPA (build 23)

on:
  public:
  workflow_dispatch:
    inputs:
      game_files:
        description: "Where the build gets your game files"
        type: choice
        options:
          - my server (Tailscale)
          - uploaded with the website builder
        default: uploaded with the website builder
      paid_account:
        description: "Ask for extra memory (on by default; untick only if your installer refuses the app)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: public-ipa-b23-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: macos-15
    timeout-minutes: 240
    env:
      FROM_UPLOAD: ${{ github.event_name == 'public' || inputs.game_files == 'uploaded with the website builder' }}
    steps:
      - uses: actions/checkout@v4

      - name: Record the exact checked source
        run: echo "BUILD_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Select the checked Xcode SDK
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -E '/Xcode_26(\.[0-9]+)*\.app$' | sort -V | tail -n 1 || true)
          if [ -z "$xcode" ]; then
            echo "::error::This runner has no stable Xcode 26. Stopping before the engine build."
            exit 1
          fi
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$xcode/Contents/Developer" xcodebuild -version

      - name: Check native optimizations and cache safety first
        run: /usr/bin/python3 app/Scripts/check_performance_update.py

      - name: Check actual A17 device compiler output before the engine build
        run: /usr/bin/python3 app/Scripts/check_a17_codegen.py --report A17-Codegen-Validation.json

      - name: Validate live super resolution, actual config rewrite and binding metadata
        run: /usr/bin/python3 app/Scripts/check_build23_features.py --report Build23-Feature-Validation.json

      - name: Fetch the pinned audio source before generating the engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$RUNNER_TEMP/opus-1.5.2.tar.gz"
          for attempt in 1 2 3; do
            if gh release download build-dependencies --repo "${{ github.repository }}" --pattern opus-1.5.2.tar.gz --output "$archive" --clobber; then
              break
            fi
          done
          echo "65c1d2f78b9f2fb20082c38cbe47c951ad5839345876e46941612ee87f9a7ce1  $archive" | shasum -a 256 -c -
          mkdir -p app/Tools
          cp "$archive" app/Tools/opus-1.5.2.tar.gz

      - name: Reuse verified engine shaders from the previous verified device build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous="$RUNNER_TEMP/previous-working.ipa"
          gh release download build-dependencies --repo "${{ github.repository }}" --pattern verified-shader-cache.ipa --output "$previous"
          echo "fc2fca21dbaeeaabee7d85babd318efd99588263cd2e2dd01802ed62567ee885  $previous" | shasum -a 256 -c -
          echo "PG_PRECOMPILED_SHADER_IPA=$previous" >> "$GITHUB_ENV"

      - name: Get the files you uploaded with the website builder
        if: ${{ env.FROM_UPLOAD == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: build-inputs
          path: uploaded-inputs

      - name: Join your tailnet (to reach your game-file server)
        if: ${{ env.FROM_UPLOAD != 'true' }}
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Check your server answers
        if: ${{ env.FROM_UPLOAD != 'true' }}
        env:
          SERVER: ${{ secrets.GAME_SERVER_URL }}
        run: |
          for i in $(seq 1 30); do
            if curl -sfI "$SERVER/data/manifest.json" > /dev/null; then echo "Server reachable."; exit 0; fi
            sleep 5
          done
          echo "::error::Can't reach $SERVER/data/manifest.json from the build machine. Is your server running and is GAME_SERVER_URL right?"
          exit 1

      - name: Install build tools
        run: brew install xcodegen

      - name: Use this repository's prebuilt shader translator, if it has one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download shadertool-1 --repo "${{ github.repository }}" --pattern pgmsl-macos-arm64.tar.gz --dir "$RUNNER_TEMP" 2>/dev/null; then
            echo "PGMSL_PREBUILT_URL=file://$RUNNER_TEMP/pgmsl-macos-arm64.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Build the IPA (about 25 minutes)
        env:
          SERVER: ${{ secrets.GAME_SERVER_URL }}
          JOBS: "2"
        run: |
          if [ "$FROM_UPLOAD" = "true" ]; then
            /usr/bin/python3 app/Scripts/assemble_inputs.py --inputs uploaded-inputs --out "$RUNNER_TEMP/game-files"
            ./build_ipa.sh --mirror "$RUNNER_TEMP/game-files" ${{ github.event_name != 'public' && !inputs.paid_account && '--free' || '' }}
          else
            ./build_ipa.sh "$SERVER" ${{ github.event_name != 'public' && !inputs.paid_account && '--free' || '' }}
          fi

      - name: Give this update a distinct filename and include the installation guide
        run: |
          mv GTA5Port.ipa GTA5Port_1.4.6_b23.ipa
          cp docs/INSTALL_BUILD_23_ZH.txt Install_Guide_ZH.txt

      - name: Validate the device IPA before publishing
        run: /usr/bin/python3 app/Scripts/validate_private_ipa.py GTA5Port_1.4.6_b23.ipa --report IPA-Validation.json

      - uses: actions/upload-artifact@v4
        with:
          name: GTA5Port-b23-spatial-super-resolution
          path: |
            GTA5Port_1.4.6_b23.ipa
            IPA-Validation.json
            A17-Codegen-Validation.json
            Build23-Feature-Validation.json
            Install_Guide_ZH.txt
          retention-days: 3

      - name: Publish this owner-authorized build and preserve the previous working IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="native-public-b23-${GITHUB_RUN_ID}"
          cat > "$RUNNER_TEMP/release-notes.txt" <<'NOTES'
          MetalFX spatial super resolution and log-driven stability update, v1.4.6 (build 23).

          Graphics now contains Off / Quality / Balanced / Performance spatial MetalFX reconstruction. The selected resolution is the output target; the game renders at a lower internal resolution, preserving aspect ratio and a 360-pixel minimum short axis. The saved mode can change live. Unsupported devices keep the original rendering dimensions. This is spatial reconstruction, not AI/temporal reconstruction or frame generation. The older screen-sharpening toggle is bypassed while a super-resolution mode is active.
          The submitted build22 phone log proved AttachmentExtension exhaustion at 348 entries. The existing in-memory gameconfig overlay now includes a 500-entry minimum, preserving higher custom values; the actual rewrite is compiled and checked for both platform sections, padding and XML validity. This repair adds about 24 KB of entry payload; it is not presented as an FPS optimization or proof of no entity leaks.
          Renderer binding plans avoid repeated immutable resource/sampler/array-length scans, bind only consumed vertex streams, and reuse raster-state resolution. Routine sonar/audio trace lines are filtered before logging locks and UI work; errors, warnings, pools and performance records remain. Full trace is available via PG_FULL_ENGINE_TRACE.
          Build23-Feature-Validation.json contains actual sizing/config checks, scoped host binding metadata measurements and an optional MetalFX pixel probe. Unsupported host MetalFX is explicitly SKIPPED. These checks do not measure iPhone gameplay FPS, CPU/GPU utilization or memory reductions. Existing game quality, dispatch unit counts, core policy and build21 memory protections are retained outside the opt-in internal resolution setting.
          See Install_Guide_ZH.txt for enabling super resolution and comparing the same route/settings on the phone.
          NOTES
          printf '\nSource commit: %s\n' "$BUILD_SOURCE_SHA" >> "$RUNNER_TEMP/release-notes.txt"
          gh release create "$tag" GTA5Port_1.4.6_b23.ipa IPA-Validation.json A17-Codegen-Validation.json Build23-Feature-Validation.json Install_Guide_ZH.txt --repo "${{ github.repository }}" --target "$BUILD_SOURCE_SHA" \
            --title "MetalFX Super Resolution + Stability (build 23)" --notes-file "$RUNNER_TEMP/release-notes.txt" --latest=false

      - name: Keep the build log if any check fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            app/Build/xcodebuild.log
            app/Build/local-asset-reads.log
            Build23-Feature-Validation.json
          if-no-files-found: ignore
          retention-days: 3
